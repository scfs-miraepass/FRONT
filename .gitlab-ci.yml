stages:
  - release
  - build

semantic-release:
  stage: release
  image: node:24
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - npm install @semantic-release/changelog @semantic-release/git @semantic-release/gitlab @semantic-release/npm @semantic-release/commit-analyzer @semantic-release/release-notes-generator -D
    - npx semantic-release
  artifacts:
    paths:
      - package.json
      - pyproject.toml

docker-build:
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull --provenance=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - if [[ "$CI_COMMIT_TAG" != *"-dev"* ]]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  after_script:
    - docker logout
  rules:
    - if: $CI_COMMIT_TAG